_schema-version: '3.3.0'
ID: quickdev
version: 1.0.0
description: QuickDev - guided tours and wdi5 tests for UI5 apps (CAP server, HANA, XSUAA login, SAP AI Core)

parameters:
  enable-parallel-deployments: true

# Everything is built first: designer (React), player, browser extension, then `cds build --production` into gen/ (see scripts/build-cf.mjs).
# Needs: npm, mbt (Cloud MTA Build Tool). Build:  mbt build -t gen --mtar quickdev.mtar
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npm --prefix designer ci
        - npm run build:cf

modules:
  # ---- the server (CAP, Node.js): API, both designers (/designer/, /designer-ui5/), player, sandbox, export ----
  - name: quickdev-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1G
      host: ${org}-${space}-quickdev-srv
      health-check-type: http
      health-check-http-endpoint: /health
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: https://${org}-${space}-quickdev-srv.${default-domain}
    requires:
      - name: quickdev-db
      - name: quickdev-auth
      - name: quickdev-aicore
    properties:
      # the server only answers for its own host names: its own route (browser extension) and the router's (people)
      TOURD_ALLOWED_HOSTS: ${org}-${space}-quickdev-srv.${default-domain},${org}-${space}-quickdev.${default-domain}
      TOURD_LLM_PROVIDER: sap-ai-core
      # a model deployed in your AI Core / Generative AI Hub and its resource group: set them in the extension
      # descriptor (deploy/prod.mtaext.example), not here
      # AICORE_MODEL / AICORE_RESOURCE_GROUP

  # ---- the login: application router (XSUAA) in front of the server ----
  - name: quickdev
    type: approuter.nodejs
    path: approuter
    parameters:
      host: ${org}-${space}-quickdev
      memory: 256M
      disk-quota: 512M
    requires:
      - name: quickdev-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  # ---- the database: deploys the tables into the HDI container ----
  - name: quickdev-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm
    requires:
      - name: quickdev-db

resources:
  - name: quickdev-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  - name: quickdev-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: quickdev-${org}-${space}
        tenant-mode: dedicated

  # SAP AI Core, plan "extended" (needed for the Generative AI Hub / orchestration service).
  # Already have an AI Core instance? Replace this resource with:
  #   type: org.cloudfoundry.existing-service
  #   parameters: { service-name: <name of your instance> }
  - name: quickdev-aicore
    type: org.cloudfoundry.managed-service
    parameters:
      service: aicore
      service-plan: extended
