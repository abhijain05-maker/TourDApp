extInstallTitle=1. Install the extension
extInstallHint=Once per browser (Chrome or Edge).
extStep1=Open <strong>chrome://extensions</strong> (or <strong>edge://extensions</strong>) and switch on <strong>Developer mode</strong>.
extStep2=Choose <strong>Load unpacked</strong> and select the <strong>extension</strong> folder of QuickDev (run <code>npm run build:extension</code> first).
extStep3=Pin the extension, click it, open its settings (the gear) and enter the address and the token from the next step.
extPairTitle=2. Pair this browser
extPairHint=Create a token for each browser or computer. It is shown once.
