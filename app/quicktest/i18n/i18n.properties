# recorder dialog
extIntro=The QuickDev recorder is a browser extension. It records what you do in your UI5 app, exactly as UI5 sees it, and sends it here. From a recording QuickTest writes a manual test case and its wdi5 test.
extInstallTitle=1. Install the extension (once)
extInstallHint=It is the same extension QuickDev uses; nothing special for tests.
extStep1=Open <strong>chrome://extensions</strong> (or <strong>edge://extensions</strong>) and switch on <strong>Developer mode</strong>.
extStep2=Choose <strong>Load unpacked</strong> and select the <strong>extension</strong> folder of QuickDev (run <code>npm run build:extension</code> first).
extStep3=Pin the extension, click it, open its settings (the gear) and enter the address and the token from the next step.
extPairTitle=2. Pair it with a token
extPairHint=The token proves that the extension may send recordings. It is shown once.
extAddress=Address of this server
extTokenName=Name of this browser
extTokenPlaceholder=for example: Kim's laptop
