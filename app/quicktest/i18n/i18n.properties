hintGemini=Set GEMINI_API_KEY (and optionally GEMINI_MODEL) in .env, then restart the server. Make sure the Gemini API is enabled for that key.
hintAiCore=Set AICORE_SERVICE_KEY (the service key as one line of JSON) or AICORE_SERVICE_KEY_FILE (the path of the downloaded key file), AICORE_MODEL (a model deployed in your resource group) and, if you do not use the default group, AICORE_RESOURCE_GROUP in .env, then restart the server. This is SAP Generative AI Hub (orchestration).
